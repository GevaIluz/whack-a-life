    <rect x="-122" y="-44" width="28" height="72" rx="12" fill="#C9302A" stroke="#1F2544" stroke-width="13"/>
    <rect x="94" y="-44" width="28" height="72" rx="12" fill="#C9302A" stroke="#1F2544" stroke-width="13"/>
    <rect x="-74" y="-38" width="136" height="16" rx="8" fill="#FFFFFF" opacity="0.55"/>
  </g>
  <!-- Action Star -->
  <path transform="translate(148, 178) scale(1.7)" d="M12 1.5l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.6l-6.4 3.5L7 14l-5.3-5 7.2-.9z" fill="#FFC93C" stroke="#1F2544" stroke-width="5" stroke-linejoin="round"/>
</svg>
