  <path d="M108 396 A148 44 0 0 0 404 396 L378 398 A122 30 0 0 1 134 398 Z" fill="#55A045"/>
  <path d="M108 396 A148 44 0 0 0 404 396" fill="none" stroke="#1F2544" stroke-width="14" stroke-linecap="round"/>
