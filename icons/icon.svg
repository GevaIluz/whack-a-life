  <g transform="translate(156, 228)">
    <path d="M24 166 V92 A76 76 0 0 1 176 92 V166 Z" fill="#A46B3E" stroke="#1F2544" stroke-width="14" stroke-linejoin="round"/>
    <path d="M54 166 V108 A46 42 0 0 1 146 108 V166 Z" fill="#DFB086"/>
    <circle cx="72" cy="84" r="11" fill="#1F2544"/>
    <circle cx="128" cy="84" r="11" fill="#1F2544"/>
    <circle cx="69" cy="80" r="3.5" fill="#FFFFFF"/>
    <circle cx="125" cy="80" r="3.5" fill="#FFFFFF"/>
    <ellipse cx="52" cy="102" rx="12" ry="7" fill="#FF7A8A" opacity="0.7"/>
    <ellipse cx="148" cy="102" rx="12" ry="7" fill="#FF7A8A" opacity="0.7"/>
    <ellipse cx="100" cy="98" rx="18" ry="12" fill="#FF6F91" stroke="#1F2544" stroke-width="9"/>
    <path d="M86 122 Q100 134 114 122" fill="none" stroke="#1F2544" stroke-width="9" stroke-linecap="round"/>
  </g>
