<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86CFFF"/>
      <stop offset="62%" stop-color="#DDF0FF"/>
      <stop offset="62.1%" stop-color="#8ED07A"/>
      <stop offset="100%" stop-color="#63B850"/>
    </linearGradient>
  </defs>
  <!-- Background card -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#sky)" stroke="#1F2544" stroke-width="20"/>
  <!-- Highlight -->
  <path d="M72 48 H440" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <!-- Sun / Burst -->
